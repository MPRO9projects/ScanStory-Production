<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} - ScanStory</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--ss-bg, #050505);
      color: var(--ss-text, rgba(255,255,255,0.92));
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
    }
    .error-card {
      width: min(100%, 520px);
      border: 1px solid var(--ss-border, rgba(255,255,255,0.08));
      border-radius: var(--ss-radius-lg, 18px);
      background: var(--ss-surface-1, #0b0b0f);
      padding: clamp(28px, 7vw, 42px);
      text-align: center;
    }
    .code {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--ss-border-strong, rgba(255,255,255,0.16));
      color: var(--ss-text-muted, rgba(255,255,255,0.6));
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.55rem, 7vw, 2.15rem); }
    p { margin: 0; color: var(--ss-text-muted, rgba(255,255,255,0.6)); line-height: 1.55; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 26px;
    }
    .actions a,
    .actions button {
      min-height: 44px;
      border-radius: 999px;
      padding: 10px 16px;
      border: 1px solid var(--ss-border-strong, rgba(255,255,255,0.16));
      background: rgba(255,255,255,0.06);
      color: var(--ss-text, rgba(255,255,255,0.92));
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }
    .actions .primary {
      border-color: rgba(255,0,122,0.42);
      background: rgba(255,0,122,0.16);
      color: #ffd6e8;
    }
    @media (max-width: 420px) {
      .actions a,
      .actions button { width: 100%; }
    }
  </style>
</head>
<body class="ss-user-scope">
  <main class="error-card" role="status" data-error-code="{{ status_code }}">
    <div class="code">ERROR {{ status_code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="actions" aria-label="Recovery actions">
      <button type="button" onclick="history.back()">Go back</button>
      <a class="primary" href="/">ScanStory home</a>
      <a href="{{ url_for('contact_page') }}">Contact support</a>
    </div>
  </main>
</body>
</html>
