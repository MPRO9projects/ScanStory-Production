{% extends "admin/base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<nav aria-label="Breadcrumb" style="margin-bottom: 10px; color: rgba(255,255,255,0.5); font-size: 13px;">
    Account &rsaquo; <span style="color: rgba(255,255,255,0.8);">Change Password</span>
</nav>
<div class="d-flex justify-content-between align-items-center mb-2">
    <h1 class="h3 mb-0">Change Password</h1>
</div>
<p class="text-muted mb-4">Update the password for your own admin account ({{ admin.email }}).</p>

<div class="card" style="max-width: 480px;">
    <div class="card-header">Update Password</div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('admin_change_password_page') }}"
              onsubmit="var b=this.querySelector('button[type=submit]'); b.disabled=true; b.textContent='Saving...'; return true;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="current_password" class="form-label">Current Password</label>
                <input type="password" id="current_password" name="current_password" class="form-control" required autocomplete="current-password">
            </div>
            <div class="mb-3">
                <label for="new_password" class="form-label">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control" required minlength="8" autocomplete="new-password">
                <div class="form-text text-muted">At least 8 characters.</div>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-admin">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
